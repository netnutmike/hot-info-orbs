name: Feature request
description: An idea for something the orbs could do or do better
labels: ["enhancement", "after-launch"]
body:
  - type: markdown
    attributes:
      value: |
        The firmware is locked on 1.8.0 until launch, so new ideas go on the after-launch list. Please send them anyway.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like the orbs to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What it would let you do, or what is awkward today.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, photos, links to something similar.
